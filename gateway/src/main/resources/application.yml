server:
  port: 8088
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: swagger
          order: 0
          uri: no://op
          predicates:
            - Path=**/api-docs/**,**/swagger/**,**/swagger-ui/**
        - id: user_service
          order: 1
          uri: ${USER_SERVICE_ENDPOINT:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
        - id: clinic_service
          order: 2
          uri: ${CLINIC_SERVICE_ENDPOINT:http://localhost:8082}
          predicates:
            - Path=/api/v1/**

