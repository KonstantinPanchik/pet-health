version: '3.8'

services:
  # === PostgreSQL для Keycloak ===
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: keycloak-postgres-pr
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword123}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    networks:
      - pethealth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === PostgreSQL для User Service ===
  postgres-users:
    image: postgres:15-alpine
    container_name: postgres-users
    environment:
      POSTGRES_DB: pet-health-users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_USERS_PASSWORD:-728926}
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    networks:
      - pethealth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet-health-users"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === PostgreSQL для Clinic Service ===
  postgres-clinic:
    image: postgres:15-alpine
    container_name: postgres-clinic
    environment:
      POSTGRES_DB: pet-health-clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_CLINIC_PASSWORD:-728926}
    volumes:
      - postgres_clinic_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pethealth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet-health-clinic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === PostgreSQL для Notifications Service ===
  postgres-notifications:
    image: postgres:15-alpine
    container_name: postgres-notifications
    environment:
      POSTGRES_DB: pet-health-notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATIONS_PASSWORD:-728926}
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pethealth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet-health-notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === RabbitMQ ===
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-p
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - pethealth-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Keycloak ===
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      # Issuer в JWT = http://keycloak:8080/auth/realms/pethealth (для валидации сервисами внутри Docker)
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: 8080
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD:-strongpassword123}
      KC_DB_SCHEMA: public
      KC_HOSTNAME_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - pethealth-network

  # === User Service ===
  user-service:
    build:
      context: .
      dockerfile: users/user-service/src/Dockerfile
    container_name: user-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-users:5432/pet-health-users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_USERS_PASSWORD:-728926}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/auth/realms/pethealth
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      APPLICATION_KEYCLOAK-ADMIN_REALM: pethealth
      APPLICATION_KEYCLOAK-ADMIN_KEYCLOAK-URL: http://keycloak:8080/auth
      APPLICATION_KEYCLOAK-ADMIN_CLIENT-ID: user-service
      APPLICATION_KEYCLOAK-ADMIN_CLIENT-SECRET: ${KEYCLOAK_USER_SERVICE_SECRET:-EYEKRs6m4RNhkenFz4pIgMlflkdBbeTL}
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - pethealth-network

  # === Clinic Service ===
  clinic-service:
    build:
      context: .
      dockerfile: clinic-service/Dockerfile
    container_name: clinic-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-clinic:5432/pet-health-clinic
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CLINIC_PASSWORD:-728926}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/auth/realms/pethealth
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres-clinic:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - pethealth-network

  # === Notifications Service ===
  notifications-service:
    build:
      context: .
      dockerfile: notifications/notifications-service/Dockerfile
    container_name: notifications-service
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notifications:5432/pet-health-notifications
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_NOTIFICATIONS_PASSWORD:-728926}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - pethealth-network

  # === Gateway ===
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      USER_SERVICE_ENDPOINT: http://user-service:8081
      CLINIC_SERVICE_ENDPOINT: http://clinic-service:8082
      KEYCLOACK_ENDPOINT: http://keycloak:8080
    depends_on:
      - user-service
      - clinic-service
      - keycloak
    ports:
      - "8088:8088"
    networks:
      - pethealth-network

networks:
  pethealth-network:
    driver: bridge

volumes:
  postgres_keycloak_data:
  postgres_users_data:
  postgres_clinic_data:
  postgres_notifications_data:
