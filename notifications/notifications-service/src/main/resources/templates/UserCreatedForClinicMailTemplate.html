<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая запись в клинику</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Новая запись на приём</h1>
        </div>
        <div class="content">
            <p>Поступила новая запись от пациента <span th:text="${initiator.initiatorName + ' ' + initiator.initiatorLastName}">Имя Фамилия</span>.</p>
            <div class="info-block">
                <p><span class="info-label">Дата и время:</span> <span th:text="${#temporals.format(appointment.dateTime, 'dd.MM.yyyy HH:mm')}">Дата и время</span></p>
                <p><span class="info-label">Питомец:</span> <span th:text="${appointment.pet?.name}">—</span></p>
                <p><span class="info-label">Причина визита:</span> <span th:text="${appointment.reason}">—</span></p>
            </div>
        </div>
        <div class="footer">
            <p>С уважением,<br>Команда PetHealth</p>
        </div>
    </div>
</body>
</html>
