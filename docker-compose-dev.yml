version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword123}
    ports:
      - "5555:5432"
    networks:
      - keycloak-network
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: keycloak-test
    command: start-dev

    environment:
      # Database

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: strongpassword123
      KC_DB_SCHEMA: public
      KC_DB_POOL_INITIAL_SIZE: 5
      KC_DB_POOL_MIN_SIZE: 5
      KC_DB_POOL_MAX_SIZE: 30

      # Hostname
      # KC_HOSTNAME: api.mycompany.com
      # Путь, по которому висит Keycloak за Gateway
      KC_HOSTNAME_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      # ГЛАВНОЕ: трафик приходит от прокси (Spring Cloud Gateway)
      KC_PROXY: edge
      # Без этой настройки Keycloak будет думать, что схема HTTP, и сломает редиректы
      KC_HTTP_RELATIVE_PATH: /auth
      # Остальные параметры (БД, админ)...

      # Admin
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}

      # Performance
      KC_CACHE: ispn
      KC_CACHE_STACK: tcp  # или tcp для standalone
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443

      # Health
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true

      # Transaction
      QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY: true

      # Logging
      KC_LOG_LEVEL: INFO
      KC_LOG_CONSOLE_COLOR: false
      KC_LOG_FILE: /opt/keycloak/data/log/keycloak.log

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./themes:/opt/keycloak/themes  # custom themes
      - ./providers:/opt/keycloak/providers  # custom providers
    depends_on:
      - postgres
    networks:
      - keycloak-network
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: always

networks:
  keycloak-network:
    name: keycloak-network
    driver: bridge

volumes:
  postgres_data:
    name: keycloak-postgres-data
  keycloak_data:
    name: keycloak-data